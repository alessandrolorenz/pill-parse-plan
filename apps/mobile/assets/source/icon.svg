<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pill-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pill-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" fill="url(#bg-grad)" />

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="190" stroke="#38bdf8" stroke-width="3" opacity="0.25" fill="none" />

  <!-- Main Pill Icon Group with Shadow -->
  <g transform="translate(256, 256) rotate(-45)" filter="url(#shadow)">
    <!-- Pill Capsule Body Outer Shape -->
    <!-- Left half (Capsule Cap - Blue) -->
    <path d="M -130,-54 
             L -3, -54 
             L -3, 54 
             L -130, 54 
             A 54 54 0 0 1 -130,-54 Z" 
          fill="url(#pill-blue)" />

    <!-- Right half (Capsule Body - White) -->
    <path d="M 3,-54 
             L 130, -54 
             A 54 54 0 0 1 130, 54 
             L 3, 54 
             Z" 
          fill="url(#pill-white)" />

    <!-- Center divider separator -->
    <line x1="0" y1="-54" x2="0" y2="54" stroke="#0f172a" stroke-width="6" opacity="0.3" />

    <!-- Medical cross mark on the blue cap -->
    <rect x="-80" y="-8" width="32" height="16" rx="4" fill="#ffffff" opacity="0.95" />
    <rect x="-72" y="-16" width="16" height="32" rx="4" fill="#ffffff" opacity="0.95" />

    <!-- Clock / Plan hands on the white side to represent 'Plan' -->
    <circle cx="68" cy="0" r="22" fill="none" stroke="#0284c7" stroke-width="4.5" />
    <circle cx="68" cy="0" r="3.5" fill="#0284c7" />
    <line x1="68" y1="0" x2="68" y2="-12" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <line x1="68" y1="0" x2="78" y2="0" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Sparkle / Smart indicator dots -->
  <circle cx="390" cy="120" r="10" fill="#38bdf8" opacity="0.85" />
  <circle cx="120" cy="390" r="8" fill="#38bdf8" opacity="0.6" />
</svg>